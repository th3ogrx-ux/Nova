<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Zenoa Agency</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
  <!-- Écran de connexion / inscription (src/auth.js s'y monte) -->
  <div id="screen-auth" role="main"></div>

  <!-- Application (visible une fois connecté) -->
  <div id="app" style="display:none;">
    <!-- Barre du haut (téléphone uniquement) : logo + paramètres -->
    <header class="mobile-topbar">
      <span class="mobile-brand"><img src="/sidebar-logo.png" alt="" width="32" height="32"><span>ZENOA</span></span>
      <button type="button" class="icon-btn" id="settings-btn-mobile" aria-label="Paramètres" title="Paramètres">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3 13.09H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <img class="sidebar-logo" src="/sidebar-logo.png" alt="">
      <span class="sidebar-brand-text">ZENOA</span>
      <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Réduire ou agrandir le menu" title="Réduire le menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="10" y1="4" x2="10" y2="20"/></svg>
      </button>
      <nav class="nav-list" aria-label="Menu principal">
        <div class="nav-group" data-roles="admin" hidden role="presentation"><span>Clients</span></div>
        <div class="nav-item" data-view="clients" data-roles="admin" hidden>
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></svg></span>
          <span class="nav-label">Clients</span>
          <span class="nav-badge due-badge" id="clients-badge" hidden></span>
        </div>
        <div class="nav-item" data-view="espace" data-roles="client admin" hidden>
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></span>
          <span class="nav-label" id="espace-nav-label">Mon espace</span>
        </div>
        <div class="nav-item" data-view="messages" data-roles="client admin" hidden>
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></span>
          <span class="nav-label" data-short="Msgs">Messages</span>
          <span class="nav-badge" id="messages-badge" hidden></span>
        </div>
        <div class="nav-group" data-roles="admin radar" hidden role="presentation"><span>Mon suivi</span></div>
        <div class="nav-item" data-view="dashboard" data-roles="admin radar">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span>
          <span class="nav-label" data-short="Tableau">Tableau de bord</span>
        </div>
        <div class="nav-item" data-view="recherche" data-roles="admin radar">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg></span>
          <span class="nav-label">Radar</span>
        </div>
        <div class="nav-item" data-view="prospection" data-roles="admin" hidden>
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg></span>
          <span class="nav-label" data-short="Prospec.">Suivi prospection</span>
        </div>
        <div class="nav-item" data-view="calendrier" data-roles="admin" hidden>
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/><circle cx="12" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/></svg></span>
          <span class="nav-label" data-short="Calend.">Calendrier</span>
        </div>
        <div class="nav-group" data-roles="admin" hidden role="presentation"><span>Livrables</span></div>
        <div class="nav-item" data-view="audits" data-roles="admin" hidden>
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 16l2 2 4-4"/></svg></span>
          <span class="nav-label">Audits</span>
        </div>
      </nav>
      <div class="sidebar-profile">
        <div class="avatar" id="my-avatar">
          <span id="my-avatar-initial"></span>
          <img id="my-avatar-img" style="display:none;" alt="">
        </div>
        <div class="sidebar-profile-info">
          <div class="sidebar-profile-name" id="my-name-display"></div>
          <div class="sidebar-profile-role" id="my-role-display"></div>
        </div>
        <button type="button" class="icon-btn" id="settings-btn" aria-label="Paramètres" title="Paramètres">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3 13.09H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </aside>

    <main class="main" id="main">
      <div id="view-root"></div>
    </main>
  </div>

  <!-- Page publique de maquette (ex: /demo/mon-entreprise), aucune authentification -->
  <div id="screen-demo" style="display:none;"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
