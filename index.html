<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Zenoa Radar</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/favicon.ico" sizes="any">

  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <div class="sidebar" id="sidebar">
      <img class="sidebar-logo" src="/sidebar-logo.png" alt="">
      <span class="sidebar-brand-text">ZENOA</span>
      <button type="button" class="sidebar-toggle" id="sidebar-toggle" title="Réduire le menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="10" y1="4" x2="10" y2="20"/></svg>
      </button>
      <div class="nav-list">
        <div class="nav-item active" data-view="accueil">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg></span>
          <span class="nav-label">Accueil</span>
        </div>
      </div>
      <div class="sidebar-profile">
        <div class="avatar"><span>Z</span></div>
        <div class="sidebar-profile-info">
          <div class="sidebar-profile-name">Zenoa Radar</div>
          <div class="sidebar-profile-role">Base design</div>
        </div>
      </div>
    </div>

    <div class="topbar">
      <span class="topbar-title">Accueil</span>
    </div>

    <div class="main">
      <h1 class="page-title">Zenoa Radar</h1>
      <p style="color:var(--light-text-dim);font-size:14px;">Base de design vide — prête pour un nouveau projet.</p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
